# Ultimate Pokémon squad — single source of truth.
#
# Schema is enforced in src/content.config.ts. To reorder, just shuffle blocks
# below or change the `order:` field (page sorts by order 1–6, slices into
# rows of 3). `blurb:` supports paragraph breaks via blank lines.

